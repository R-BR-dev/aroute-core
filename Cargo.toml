[workspace]
resolver = "3"
members = ["crates/*"]

# Values every crate inherits with `<key>.workspace = true`, so the version and
# license are stated once.
[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
repository = "https://github.com/R-BR-dev/aroute-core"

# One place for dependency versions. A crate opts in with `name.workspace = true`.
[workspace.dependencies]
aroute-model = { path = "crates/aroute-model" }
aroute-sys = { path = "crates/aroute-sys" }
aroute-engine = { path = "crates/aroute-engine" }

anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
http-body-util = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
sd-notify = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs"] }
tokio-util = "0.7"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = "6"
utoipa-axum = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
strip = "debuginfo"
